name: KENDO FARM quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  unit-integration-build:
    name: Unit, integration, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Frontend coverage thresholds
        run: npm run test:coverage

      - name: Backend Worker and D1 integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

  cypress:
    name: Cypress end-to-end tests
    runs-on: ubuntu-latest
    needs: unit-integration-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Start local site
        shell: bash
        run: |
          npm run start > "$RUNNER_TEMP/kendo-farm-start.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kendo-farm.pid"
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/kendo-farm-start.log"
          exit 1

      - name: Run Cypress
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:8787
        run: npm run test:e2e

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            site/cypress/screenshots
            site/cypress/videos
            ${{ runner.temp }}/kendo-farm-start.log
          if-no-files-found: ignore
